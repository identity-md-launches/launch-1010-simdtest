[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

[fmt]
line_length = 110

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
